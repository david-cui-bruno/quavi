services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quavi
      POSTGRES_PASSWORD: local-quavi-only
      POSTGRES_DB: quavi
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - quavi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quavi -d quavi"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  quavi_data:
