appId: com.quavi.app
name: iPhone navigation and destination regression checks
---
# Run only against a disposable simulator: this resets its Quavi demo data.
- launchApp:
    clearState: true
- assertVisible: "Explore the demo"
- tapOn: "Explore the demo"
- tapOn:
    point: 50%,26%
- inputText: "Maya"
- hideKeyboard
- tapOn: "Yes, 21+"
- tapOn: "Continue"
- tapOn: "Next"
- tapOn: "Looks like me"
- assertVisible: "Take a detour"
- tapOn: "You"
- scrollUntilVisible:
    element: "Friends Add your first friend ›"
    centerElement: true
    timeout: 15000
- tapOn: "Friends Add your first friend ›"
- assertVisible: "Friends."
# Reselecting You from a nested page must return to Profile.
- tapOn: "You"
- assertVisible: "Edit your Quavi"
- tapOn: "Explore"
- assertVisible: "Surprise me with a detour"
- tapOn: "Where to?"
- inputText: "Washington Square Park"
- pressKey: Enter
# Exact destination wins over nearby sub-places such as its dog run.
- extendedWaitUntil:
    visible: "Start my detour to Washington Square Park"
    timeout: 30000
